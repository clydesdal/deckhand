[package]
name = "deckhand"
version = "0.1.0"
edition = "2024"
default-run = "deckhand"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.105"
elgato-streamdeck = "0.14.0"
enigo = "0.6.1"
image = "0.25.10"
imageproc = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
tray-icon = "0.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1.34"
